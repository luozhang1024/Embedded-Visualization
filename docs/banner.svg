<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">芯知 · Embedded Visualization</title>
  <desc id="desc">看见信号，理解每一次变化。芯片、电平与二进制数据的概念插画。</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#f0f5ff"/><stop offset="1" stop-color="#f7f4fd"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#3ca0ff"/><stop offset="1" stop-color="#1763d6"/></linearGradient>
    <linearGradient id="chip" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8f0fb"/></linearGradient>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Microsoft YaHei, sans-serif">
    <text x="65" y="76" font-size="12" letter-spacing="3" fill="#007aff">SMALL CHIP. BIG IDEAS.</text>
    <text x="65" y="149" font-size="48" font-weight="650" fill="#1d1d1f">芯知</text>
    <text x="65" y="198" font-size="26" fill="#2874ce">看见信号，理解每一次变化。</text>
    <text x="65" y="237" font-size="15" fill="#8892a2">让抽象的嵌入式知识，变成可以探索的世界。</text>
    <rect x="65" y="279" width="210" height="32" rx="16" fill="#fff"/>
    <text x="170" y="300" text-anchor="middle" font-size="10" letter-spacing="2" fill="#71849e">EMBEDDED VISUALIZATION</text>
    <circle cx="909" cy="182" r="153" fill="#e6eefe" opacity=".5"/>
    <path d="M691 100h45m-45 25h45m-45 25h45m-45 25h45m-45 25h45m-45 25h45m-45 25h45m180-150h35m-35 25h35m-35 25h35m-35 25h35m-35 25h35m-35 25h35m-35 25h35" stroke="#afc6e8" stroke-width="6" stroke-linecap="round"/>
    <rect x="727" y="70" width="195" height="215" rx="22" fill="url(#chip)" stroke="#c9d9ee"/>
    <rect x="741" y="84" width="167" height="187" rx="14" fill="none" stroke="#d7e4f5"/>
    <rect x="791" y="110" width="66" height="65" rx="16" fill="url(#blue)"/>
    <text x="824" y="154" text-anchor="middle" font-size="34" fill="#fff">芯</text>
    <text x="824" y="215" text-anchor="middle" font-size="21" fill="#435772">STM32</text>
    <text x="824" y="242" text-anchor="middle" font-size="10" letter-spacing="2" fill="#94a4b9">EXPLORE INSIDE</text>
    <path d="M945 150h26v-37h40v37h36v-37h36v37h48" fill="none" stroke="#007aff" stroke-width="3"/>
    <circle cx="1050" cy="224" r="30" fill="#007aff0d"/>
    <circle cx="1050" cy="224" r="16" fill="#398bff"/>
    <text x="1050" y="280" text-anchor="middle" font-size="11" fill="#7f98b9">SIGNALS → INSIGHT</text>
  </g>
</svg>
